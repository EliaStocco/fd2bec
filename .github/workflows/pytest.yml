name: Run Pytest

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        test-file:
          - tests/test_ase.py
          - tests/test_geometry.py
          - tests/test_spglib.py
          - tests/test_fractional.py
          - tests/test_rotations.py
          - tests/test_conventional.py
          - tests/test_symmetry.py
          - tests/test_symmetrizer.py
          - tests/test_symmetrizer_rotated.py
          - tests/test_symmetry_molecules.py

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests (single file)
        run: pytest ${{ matrix.test-file }} -x