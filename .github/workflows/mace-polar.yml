name: MACE-POLAR regression

on:
  pull_request:
  push:
    branches:
      - master
      - develop

concurrency:
  group: mace-polar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  mace-polar:
    name: MACE-POLAR dP/dR regression
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fd2bec and MACE-POLAR
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mace-polar]" "mace-torch==0.3.16"

      - name: Test the MACE-POLAR dataset adapter
        run: pytest -q tests/test_mace_polar.py

      - name: Cache MACE-POLAR-1-M checkpoint
        uses: actions/cache@v4
        with:
          path: tests/mace_polar/MACE-POLAR-1-M.model
          key: mace-polar-1-m-${{ hashFiles('tests/mace_polar/download_mace_polar.sh') }}

      - name: Download MACE-POLAR-1-M checkpoint
        run: bash tests/mace_polar/download_mace_polar.sh

      - name: Predict finite-displacement dipoles
        run: |
          mace_polar_dPdR \
            --input tests/mace_polar/water.extxyz \
            --model tests/mace_polar/MACE-POLAR-1-M.model \
            --amplitude 0.01 \
            --default-dtype float64 \
            --output mace-polar-dataset.extxyz

      - name: Fit Born effective charges
        run: dPdR2bec --input mace-polar-dataset.extxyz --output mace-polar-results

      - name: Check regression
        run: |
          python tests/mace_polar/check_regression.py \
            --dataset mace-polar-dataset.extxyz \
            --bec mace-polar-results/bec.txt

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mace-polar-regression
          path: |
            mace-polar-dataset.extxyz
            mace-polar-results/
          if-no-files-found: ignore
