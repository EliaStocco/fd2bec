name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # -------------------- TEST FILES --------------------

      - name: tests/test_ase.py
        run: |
          start=$(date +%s)

          if ! pytest -q tests/test_ase.py; then
            end=$(date +%s)
            echo "❌ Failed in tests/test_ase.py ($((end-start))s)"
            pytest -vv --ff --nf -x tests/test_ase.py
            exit 1
          fi

          end=$(date +%s)
          echo "✅ tests/test_ase.py passed ($((end-start))s)"

      - name: tests/test_geometry.py
