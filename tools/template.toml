[project]
name = "fd2bec"
version = "0.0.0"
description = "A python package to efficiently evaluate Born Effective Charges using Finite Differences."
authors = [
    { name = "Elia Stocco", email = "eliastocco@gmail.com" }
]
requires-python = ">=3.9"

dependencies = [
    "numpy",
    # "scipy",
    "pandas",
    "typing-extensions",  # For better compatibility with type hints
    "matplotlib",
    "argparse",
    "dataclasses; python_version < '3.10'",  # Built-in from Python 3.10+
    "tqdm",
    "pathlib",
    "spglib",
    "ase"
]

[project.optional-dependencies]
dev = [
    # "pymatgen",
    # "mp-api",
    "ruff",
    "isort",
    "pylint",
    "black==24.8.0",
    "pytest",
    "pytest-cov"
]
dev-mp = [
    "pymatgen",
    "mp-api",
    "python_requires>=3.11; python_version < '3.11'"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
fd2bec = ["structures/*.extxyz", "*.mplstyle"]

[tool.setuptools]
packages = ["fd2bec"]  # only include fd2bec

[tool.black]
line-length = 100