[project]
name = "fd2bec"
version = "0.0.0"
description = "A python package to efficiently evaluate Born Effective Charges using Finite Differences."
authors = [
    { name = "Elia Stocco", email = "eliastocco@gmail.com" }
]
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "typing-extensions",  # For better compatibility with type hints
    "matplotlib",
    "argparse",
    "dataclasses; python_version < '3.10'",  # Built-in from Python 3.10+
    "tqdm",
    "pathlib",
    "pytest",
    "spglib",
    "ase"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
fd2bec = ["structures/*.extxyz", "*.mplstyle"]

[tool.setuptools]
packages = ["fd2bec"]  # only include fd2bec

# This part is auto-generated by tools/initialize.py
[project.scripts]

# --- root ---
apply_displacements = "fd2bec.cli.apply_displacements:main"
bec2charges = "fd2bec.cli.bec2charges:main"
bec_extxyz2txt = "fd2bec.cli.bec_extxyz2txt:main"
generate_all_displacements = "fd2bec.cli.generate_all_displacements:main"
generate_random_displacements = "fd2bec.cli.generate_random_displacements:main"
generate_supercell = "fd2bec.cli.generate_supercell:main"
generate_symmetry_inequivalent_displacements = "fd2bec.cli.generate_symmetry_inequivalent_displacements:main"
info_extxyz2txt = "fd2bec.cli.info_extxyz2txt:main"
overview = "fd2bec.cli.overview:main"
prepare_linear_system = "fd2bec.cli.prepare_linear_system:main"
solution2bec_txt = "fd2bec.cli.solution2bec_txt:main"
solve_linear_system = "fd2bec.cli.solve_linear_system:main"

